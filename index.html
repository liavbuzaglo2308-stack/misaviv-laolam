<body>
<div id="nojs"><div><h2>מסביב לעולם</h2><p>המשחק לא יכול לרוץ בתצוגה המקדימה הזו.<br>פתחו את הקובץ בדפדפן (Chrome, Edge או Safari), או השתמשו בקישור למשחק.</p></div></div>
<title>מסביב לעולם</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Secular+One&display=swap">
<style>
/* Layout: one 1600x900 stage scaled to fit; board on the left, the turn panel (players, dice, card) on the right. Single deliberate look (game colors), both host themes. */
:root {
  --sea-deep: #0b3a6e; --ink: #1b2440; --muted: #4a5576; --paper: #fffaf0; --line: #e3e8f0;
  --blue: #1d7fe0; --blue-d: #0f5bb0; --green: #22a447; --green-d: #13782f;
  --yellow: #f5a400; --yellow-d: #a86800; --red: #e8382f; --red-d: #b5221b; --gold: #ffcf3f;
  --display: 'Secular One', 'Rubik', sans-serif; --body: 'Rubik', 'Segoe UI', Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: #0d3f73; color: var(--ink); font-family: var(--body); overflow: hidden; }
#fit { position: fixed; inset: 0; overflow: hidden; }
#stage { width: 1600px; height: 900px; position: absolute; left: 50%; top: 50%; transform-origin: center; direction: rtl;
  background: radial-gradient(120% 90% at 30% 30%, #4fc3f7 0%, #1e8fe0 55%, #1570c4 100%); overflow: hidden; border-radius: 18px; }
button { font-family: var(--body); cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

/* top bar */
.top { position: absolute; top: 0; left: 0; right: 0; height: 84px; display: flex; align-items: center; gap: 18px; padding: 0 30px; color: #fff; }
.logo { font-family: var(--display); font-size: 32px; background: var(--red); padding: 2px 20px 8px; border-radius: 14px; box-shadow: 0 5px 0 var(--red-d); transform: rotate(-2deg); }
.turnlbl { font-family: var(--display); font-size: 30px; }
.tools { margin-inline-start: auto; display: flex; gap: 10px; }
.iconbtn { background: rgba(255,255,255,.18); color: #fff; border: 2px solid rgba(255,255,255,.55); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 16px; }
.iconbtn:hover { background: rgba(255,255,255,.3); }

/* board */
.boardwrap { position: absolute; top: 96px; right: 640px; left: 30px; bottom: 30px; border-radius: 18px; overflow: hidden; background: #1e8fe0; box-shadow: 0 10px 30px rgba(0,0,0,.25), inset 0 0 0 4px rgba(255,255,255,.7); }
.boardinner { position: absolute; left: 0; top: 0; width: 930px; height: 657.4px; transform-origin: 0 0; transition: transform 1s cubic-bezier(.45,.05,.2,1); }
.boardinner > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pawn .bob { transform-box: fill-box; transform-origin: 50% 100%; }
.pawn.hop .bob { animation: hop .26s ease-out; }
.pawn.me .halo { opacity: 1; }
.halo { opacity: 0; transition: opacity .3s; }
@keyframes hop { 45% { transform: translateY(-7px) scale(1.1); } }
.ring { animation: ring 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ring { 0% { opacity: .9; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.2); } }
.zoomtoggle { position: absolute; bottom: 14px; left: 14px; background: rgba(255,255,255,.94); border: 0; border-radius: 999px; padding: 9px 18px; font-weight: 700; font-size: 16px; color: var(--sea-deep); box-shadow: 0 3px 10px rgba(0,0,0,.2); }

/* panel */
.panel { position: absolute; top: 96px; right: 30px; width: 590px; bottom: 30px; display: flex; flex-direction: column; gap: 14px; }
.players { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 8px; }
.pl { background: rgba(255,255,255,.88); border-radius: 14px; padding: 9px 10px; display: flex; align-items: center; gap: 9px; min-width: 0; border: 3px solid transparent; transition: transform .25s, background .25s; }
.pl.on { background: #fff; border-color: var(--pc); transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0,0,0,.2); }
.pl .chip { width: 30px; height: 30px; border-radius: 50%; background: var(--pc); flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.pl .nm { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .ps { font-size: 13px; color: var(--muted); }
.pl .ps b { color: var(--ink); }
.pl .badges { display: flex; gap: 3px; margin-top: 2px; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 999px; color: #fff; }
.b-shield { background: var(--blue); } .b-hint { background: var(--yellow-d); } .b-skip { background: #7a849e; }

.play { flex: 1; display: grid; grid-template-columns: 196px 1fr; gap: 14px; min-height: 0; }
.dicecol { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: rgba(255,255,255,.14); border-radius: 18px; border: 2px dashed rgba(255,255,255,.5); }
.dice { display: flex; gap: 14px; }
.scene { width: 92px; height: 92px; perspective: 600px; }
.dice.single .scene { width: 116px; height: 116px; }
.cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateX(-22deg) rotateY(28deg); }
.cube.roll { transition: transform 1.3s cubic-bezier(.15,.75,.2,1); }
.face { position: absolute; inset: 0; background: #fff; border-radius: 18%; box-shadow: inset 0 0 0 3px #e3e8f0, inset 0 -8px 14px rgba(0,0,0,.08);
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 13%; box-sizing: border-box; backface-visibility: hidden; }
.pip { width: 72%; height: 72%; border-radius: 50%; background: var(--ink); place-self: center; }
.pip.r { background: var(--red); width: 82%; height: 82%; }
.f1 { transform: translateZ(var(--h)); } .f6 { transform: rotateY(180deg) translateZ(var(--h)); }

/* ---------- sound (synthesized, no files) ---------- */
let AC = null;

/* ---------- state ---------- */
const S = { settings: {timer: 20, six: 0, two: 0, sound: 1}, setup: {n: 2, players: [0,1,2,3].map(i => ({name: `שחקן ${i+1}`, color: PCOLORS[i]}))},

const OFF = [[-2.8,-1.2],[2.8,-1.2],[-2.8,2.4],[2.8,2.4]];

  S.players.forEach((p, i) => { const same = S.players.filter(q => q.pos === p.pos); const k = same.indexOf(p);
    const o = same.length > 1 || p.pos < 0 || p.pos >= FINISH ? OFF[k] : [0, 0]; const s = spot(p.pos);

    $('pawn' + i).classList.toggle('me', i === S.cur); });

function renderPlayers(){
  $('players').innerHTML = S.players.map((p, i) => `<div class="pl${i === S.cur ? ' on' : ''}" style="--pc:${p.color}">

function camera(){
  const inner = $('boardinner'), wrap = $('boardwrap'), W = wrap.clientWidth, H = wrap.clientHeight, base = W / 930;
  if (S.zoomAll) { inner.style.transform = `scale(${base})`; return; }
  const f = spot(S.players[S.cur].pos), z = 1.9, k = 930 / 420, s = base * z;
  let tx = W / 2 - f.x * k * s, ty = H / 2 - f.y * k * s;

function target(pos){ const g = $('target'); g.innerHTML = ''; if (pos == null || pos < 0 || pos >= FINISH) return; const p = SQ[pos];
  g.innerHTML = [0, .7].map(dl => `<circle class="ring" style="animation-delay:${dl}s" cx="${p.x}" cy="${p.y}" r="7" fill="none" stroke="#fff" stroke-width="1.6"/>`).join(''); }
function say(html, buttons = []){ $('msg').innerHTML = html; const a = $('actions'); a.innerHTML = '';

  const first = a.querySelector('button'); if (first) first.focus({preventScroll: true}); }
function hideCard(){ $('card').classList.remove('in', 'flipped'); $('pile').hidden = false; }
const P = () => S.players[S.cur];
const nm = p => `<b style="color:${p.color}">${esc(p.name)}</b>`;

function beginTurn(){
  S.busy = false; S.rolledSix = false; hideCard(); target(null); placeAll(); camera();
  const p = P(); $('turnlbl').innerHTML = `התור של ${esc(p.name)}`;
  if (p.skip) { p.skip = false; renderPlayers(); $('rollbtn').disabled = true;
    say(`${nm(p)} נתקע בסערה ומדלג על התור הזה.`, [{t: 'לתור הבא ←', fn: nextTurn}]); return; }
  $('rollbtn').disabled = false; $('rolled').innerHTML = '';
  say(`${nm(p)}, ${S.settings.two ? 'זרקו את הקוביות' : 'זרקו את הקובייה'}. (אפשר גם ברווח במקלדת)`);
}
function nextTurn(){ S.cur = (S.cur + 1) % S.players.length; beginTurn(); }

async function roll(){
  if (S.busy || $('rollbtn').disabled) return; S.busy = true; $('rollbtn').disabled = true; const t = S.token, p = P();
  const vals = S.settings.two ? [rnd6(), rnd6()] : [rnd6()];
  SFX.dice();
  vals.forEach((v, i) => { const c = $('cube' + (i + 1)); c.classList.remove('roll'); c.style.transform = 'rotateX(-22deg) rotateY(28deg)'; void c.offsetWidth;
    const [fx, fy] = FACE[v], sx = 360 * (2 + Math.floor(Math.random() * 3)), sy = 360 * (2 + Math.floor(Math.random() * 3));
    c.classList.add('roll'); c.style.transform = `rotateX(${fx + sx - 12}deg) rotateY(${fy + sy + 14}deg)`; });
  await sleep(1350); if (t !== S.token) return;
  const sum = vals.reduce((a, b) => a + b, 0);
  S.rolledSix = S.settings.six && (S.settings.two ? vals[0] === vals[1] : vals[0] === 6);
  $('rolled').innerHTML = `${vals.length > 1 ? vals.join(' + ') + ' = ' : 'יצא '}<b>${sum}</b>${S.rolledSix ? `<small>${S.settings.two ? 'דאבל!' : '6!'} תור נוסף</small>` : ''}`;
  say(`${nm(p)} מתקדם ${sum} משבצות...`);
  const done = await walk(p, sum, t); if (done === 'stop') return;

async function walk(p, n, t){
  const dir = Math.sign(n);
  for (let k = 0; k < Math.abs(n); k++) {
    if (t !== S.token) return 'stop';
    const nxt = p.pos + dir; if (nxt < -1) break;
    p.pos = nxt; placeAll(); camera(); SFX.step();
    const g = $('pawn' + S.players.indexOf(p)); g.classList.remove('hop'); void g.getBBox(); g.classList.add('hop');
    await sleep(300);
    if (p.pos >= FINISH) return 'win';
  }
  return 'ok';
}

async function land(p, t){
  const k = COLOR_OF[SQ[p.pos].c], d = DECK[k]; target(p.pos);
  say(`${nm(p)} נחת על <b style="color:${d.c}">משבצת ${d.color}</b>. שולפים קלף...`);
  await sleep(750); if (t !== S.token) return;
  if (k === 'red') showRed(p, draw('red'), t); else ask(p, k, draw(k), t);
}

/* ---------- question cards ---------- */
let timerId = null;
function stopTimer(){ clearInterval(timerId); timerId = null; }
function ask(p, k, card, t){
  const d = DECK[k], v = `--c:${d.c};--d:${d.d};--l:${d.l}`;

  $('cardfront').innerHTML = `<div class="cf" style="${v}"><div class="win">${DATA.art[card.art] || ''}${S.settings.timer ? '<div class="timer"><i id="tbar"></i></div><div class="secs" id="tsec"></div>' : ''}</div>
    <div class="ribbon"><i>${d.icon}</i>${d.name}</div>
    <div class="qbox"><div class="q${qlong ? ' long' : ''}">${esc(card.q)}</div>
    <div class="opts">${order.map((oi, j) => `<button type="button" class="opt" data-oi="${oi}"><b>${'אבג'[j]}</b>${esc(card.opts[oi])}</button>`).join('')}</div>
    ${p.hint ? '<button type="button" class="hintbtn" id="hintbtn">מצפן קסום: מחקו תשובה שגויה</button>' : ''}</div>
    <div class="cfoot">✦ מסביב לעולם ✦</div></div>`;

  $('pile').hidden = true; $('card').classList.remove('flipped'); void $('card').offsetWidth; $('card').classList.add('in'); SFX.card();

    ok ? SFX.right() : SFX.wrong();
    setTimeout(() => { if (t !== S.token) return; reveal(p, k, card, ok, oi === -1, t); }, 900);
  };
  document.querySelectorAll('#cardfront .opt').forEach(b => b.onclick = () => finish(+b.dataset.oi));
  if ($('hintbtn')) $('hintbtn').onclick = () => { p.hint = false; renderPlayers(); $('hintbtn').remove();
    const wrongs = [...document.querySelectorAll('#cardfront .opt')].filter(b => b.dataset.oi !== '0'); const w = wrongs[Math.floor(Math.random() * wrongs.length)];
    w.classList.add('gone'); w.disabled = true; };
  if (S.settings.timer) { const end = Date.now() + S.settings.timer * 1000, total = S.settings.timer * 1000; let lastS = -1;
    timerId = setInterval(() => { const left = Math.max(0, end - Date.now()), frac = left / total, sec = Math.ceil(left / 1000);
      if ($('tbar')) { $('tbar').style.width = (frac * 100) + '%'; $('tbar').style.background = frac < .25 ? 'var(--red)' : frac < .5 ? 'var(--yellow)' : 'var(--green)'; }

}
function reveal(p, k, card, ok, timeout, t){
  const d = DECK[k], v = `--c:${d.c};--d:${d.d};--l:${d.l}`, ans = card.opts[0];

/* ---------- surprise cards ---------- */
function showRed(p, card, t){
  const d = DECK.red, v = `--c:${d.c};--d:${d.d};--l:${d.l}`;
  $('cardfront').innerHTML = `<div class="redback" id="redfront" role="button" tabindex="0" aria-label="הפכו את הקלף"><div><div class="bang">!</div><h3>הפתעות בדרך</h3><p>לחצו כדי להפוך</p></div></div>`;
  $('cardback').innerHTML = `<div class="cf" style="${v}"><div class="win">${DATA.art[card.art] || ''}</div><div class="ribbon"><i>!</i>${d.name}</div>
    <div class="qbox"><div class="rtitle">${esc(card.q)}</div><div class="ract">${esc(card.a)}</div></div><div class="cfoot">✦ מסביב לעולם ✦</div></div>`;

function others(p){ return S.players.filter(q => q !== p); }

    return say(`${nm(p)} ${fx.n > 0 ? 'מתקדם' : 'חוזר'} ${Math.abs(fx.n) === 1 ? 'משבצת אחת' : Math.abs(fx.n) + ' משבצות'}.`, [{t: fx.n > 0 ? `קדימה ${fx.n} ←` : `אחורה ${-fx.n}`, cls: fx.n > 0 ? 'green' : 'red', fn: () => go(fx.n)}]);
  }
  if (fx.t === 'skip') { p.skip = true; renderPlayers(); return say(`${nm(p)} ידלג על התור הבא שלו.`, [{t: 'המשך ←', fn: afterTurn}]); }
  if (fx.t === 'shield') { p.shield = true; renderPlayers(); return say(`${nm(p)} שומר את החותמת. היא תבטל את הקלף הבא שמחזיר אחורה.`, [{t: 'המשך ←', fn: afterTurn}]); }
  if (fx.t === 'hint') { p.hint = true; renderPlayers(); return say(`${nm(p)} שומר את המצפן. בשאלה הבאה יופיע כפתור שמוחק תשובה שגויה.`, [{t: 'המשך ←', fn: afterTurn}]); }
  if (fx.t === 'again') { return say(`${nm(p)} זורק שוב!`, [{t: 'לזריקה ←', cls: 'green', fn: () => { S.busy = false; hideCard(); target(null); $('rollbtn').disabled = false; $('rolled').innerHTML = ''; say(`${nm(p)}, זרקו שוב.`); }}]); }
  if (fx.t === 'ask') { return say(`${nm(p)} עונה על שאלת ידע. תשובה נכונה מקדמת משבצת.`, [{t: 'לשאלה ←', fn: () => ask(p, fx.deck, draw(fx.deck), t)}]); }
  if (fx.t === 'goto') {
    let to = -1; for (let i = p.pos + 1; i < FINISH; i++) if (SQ[i].c === fx.c) { to = i; break; }
    const k = COLOR_OF[fx.c];
    if (to < 0) return say(`אין עוד משבצת ${DECK[k].color} לפניכם. ממשיכים כרגיל.`, [{t: 'המשך ←', fn: afterTurn}]);
    return say(`${nm(p)} נוסע ${to - p.pos} משבצות עד המשבצת ה${DECK[k].color.replace('ה', '')} הבאה.`, [{t: 'יוצאים ←', cls: 'green', fn: async () => {
      const r = await walk(p, to - p.pos, t); if (r === 'stop') return; target(p.pos); hideCard(); await sleep(400); ask(p, k, draw(k), t); }}]);
  }
  if (fx.t === 'guide') {
    const o = others(p); if (!o.length) return say(`אין עוד שחקנים, אז רק ${nm(p)} מתקדם משבצת.`, [{t: 'קדימה ←', cls: 'green', fn: () => go(1)}]);
    const q = o.slice().sort((a, b) => Math.abs(a.pos - p.pos) - Math.abs(b.pos - p.pos))[0];
    return say(`${nm(p)} ו־${nm(q)} מתקדמים משבצת אחת.`, [{t: 'קדימה ←', cls: 'green', fn: async () => {
      const r1 = await walk(q, 1, t); if (r1 === 'win') return win(q); if (r1 === 'stop') return; go(1); }}]);
  }
  if (fx.t === 'swap') {
    const ahead = others(p).filter(q => q.pos > p.pos).sort((a, b) => a.pos - b.pos)[0];
    if (!ahead) return say(`אין אף אחד לפני ${nm(p)}. ${S.players.length > 1 ? 'אתם מובילים!' : ''} נשארים במקום.`, [{t: 'המשך ←', fn: afterTurn}]);
    return say(`${nm(p)} מתחלף במקום עם ${nm(ahead)}.`, [{t: 'החליפו ←', cls: 'green', fn: () => { [p.pos, ahead.pos] = [ahead.pos, p.pos]; SFX.surprise(); placeAll(); camera(); afterTurn(); }}]);
  }
  afterTurn();
}

function afterTurn(){
  hideCard(); target(null); renderPlayers();
  if (S.rolledSix) { S.rolledSix = false; const p = P();
    return say(`${nm(p)} זרק ${S.settings.two ? 'דאבל' : '6'}, ולכן משחק תור נוסף!`, [{t: 'לתור הנוסף ←', cls: 'green', fn: () => { S.busy = false; $('rollbtn').disabled = false; $('rolled').innerHTML = ''; camera(); say(`${nm(p)}, זרקו שוב.`); }}]); }
  if (S.players.length === 1) return beginTurn();
  say(`התור עובר ל־${nm(S.players[(S.cur + 1) % S.players.length])}.`, [{t: 'לתור הבא ←', fn: nextTurn}]);
}

/* ---------- win ---------- */
function win(p){
  stopTimer(); S.token++; p.pos = FINISH; placeAll(); camera(); SFX.win();
  $('winname').textContent = `${p.name} ניצח!`;
  $('wintext').textContent = S.players.length > 1 ? 'הגעתם ראשונים לדגל באנטארקטיקה. כל הכבוד!' : 'השלמתם את המסע מסביב לעולם. כל הכבוד!';
  setTimeout(() => { $('winner').classList.remove('hide'); confetti(); }, 700);
}
function confetti(){
  const cv = $('confetti'), cx = cv.getContext('2d'); cv.width = SW; cv.height = SH;
  const cols = ['#1d7fe0', '#22a447', '#f5a400', '#e8382f', '#ffcf3f', '#fff'];
  const bits = Array.from({length: 180}, () => ({x: Math.random() * SW, y: -20 - Math.random() * 600, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6.3, s: 6 + Math.random() * 8, c: cols[Math.floor(Math.random() * cols.length)]}));
  let f = 0; (function frame(){ cx.clearRect(0, 0, SW, SH);
    bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.r += .1; cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore(); });
    if (++f < 260) requestAnimationFrame(frame); else cx.clearRect(0, 0, SW, SH); })();
}

/* ---------- wiring ---------- */
$('rollbtn').onclick = roll;
$('startbtn').onclick = () => startGame(false);
$('again').onclick = () => startGame(true);
$('tosetup').onclick = $('newbtn').onclick = () => { stopTimer(); S.token++; renderSetup(); $('winner').classList.add('hide'); $('setup').classList.remove('hide'); };
$('zoombtn').onclick = () => { S.zoomAll = !S.zoomAll; $('zoombtn').textContent = S.zoomAll ? 'התקרבות' : 'כל הלוח'; camera(); };
$('soundbtn').onclick = () => { S.settings.sound = S.settings.sound ? 0 : 1; $('soundbtn').textContent = 'צלילים: ' + (S.settings.sound ? 'פועל' : 'כבוי'); };
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' && !$('setup').classList.contains('hide')) return;
  if (e.key === ' ' && !$('rollbtn').disabled) { e.preventDefault(); roll(); } });
renderSetup();
S.players = [{name: '', color: PCOLORS[0], pos: -1}]; $('pawns').innerHTML = ''; fit(); camera();
</script>
